[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meca-ia-ml-explorer"
dynamic = ["version"]
description = "Application guidée d'apprentissage automatique sur données tabulaires, avec garde-fous."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philippe Amuzuga" }]
keywords = ["apprentissage automatique", "scikit-learn", "génie mécanique", "enseignement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: French",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "openpyxl>=3.1",
    "joblib>=1.5",
]

[project.optional-dependencies]
keras = ["tensorflow>=2.21", "keras>=3.15"]

[project.scripts]
mecaml = "mecaml.__main__:principal"

[project.urls]
Source = "https://github.com/philippe-amuzuga/meca-ia-ml-explorer"

[tool.setuptools.dynamic]
version = { attr = "mecaml.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mecaml.textes" = ["*.toml"]
mecaml = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not lent'"
python_classes = ["Test_*"]  # l'action `Tester` n'est pas une classe de tests
filterwarnings = ["error"]
markers = [
    "lent: mesures longues (preuves de concept), exclues de la suite courante ; lancer avec -m lent",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "RUF001",  # lettres accentuées et apostrophes typographiques voulues dans les textes
    "RUF002",
    "RUF003",
    "N818",  # exceptions nommées en français (ErreurScelle, TransitionRefusee)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]  # tests d'invariants nommés test_I<n>_...

[tool.ruff.lint.isort]
known-first-party = ["mecaml"]
